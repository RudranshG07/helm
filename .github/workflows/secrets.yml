name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed credentials
        run: |
          set -e
          if git grep -nIE 'rzp_live_[A-Za-z0-9]{8,}' -- . ; then
            echo "A live Razorpay key is committed." >&2; exit 1
          fi
          if git grep -nIE 'sk-ant-[A-Za-z0-9-]{16,}' -- . ; then
            echo "An Anthropic key is committed." >&2; exit 1
          fi
          tracked_env="$(git ls-files | grep -E '(^|/)\.env' | grep -v '\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked env files with real values:" >&2
            echo "$tracked_env" >&2
            exit 1
          fi
          echo "No credentials found in tracked files."
